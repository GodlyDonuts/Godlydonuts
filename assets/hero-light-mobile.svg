<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 680" role="img" aria-labelledby="title desc">
  <title id="title">Saicharan Ramineni</title>
  <desc id="desc">Sai. I am not very interested in making the expected thing.</desc>
  <defs><style>
    text { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; }
    @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
  </style></defs>
  <rect width="420" height="680" fill="#F5F0E7"/>
  <text x="22" y="35" fill="#6E6876" font-size="12" font-weight="700" letter-spacing="1.5">SAICHARAN RAMINENI</text>
  <text x="22" y="62" fill="#6E6876" font-size="11">Computer Science at UCF · Orlando</text>
  <text x="13" y="225" fill="#15131B" font-size="164" font-weight="900" letter-spacing="-13">SAI</text>
  <circle cx="327" cy="168" r="68" fill="#ED512F"/>
  <circle class="motion" cx="344" cy="157" r="64" fill="#F5F0E7">
    <animate attributeName="cx" values="344;331;344" dur="11s" repeatCount="indefinite"/>
  </circle>
  <rect x="0" y="310" width="420" height="370" fill="#2645FF"/>
  <text x="24" y="365" fill="#FBF7EF" font-size="38" font-weight="820" letter-spacing="-1.2">I am not very</text>
  <text x="24" y="413" fill="#FBF7EF" font-size="38" font-weight="820" letter-spacing="-1.2">interested in</text>
  <text x="24" y="461" fill="#FBF7EF" font-size="38" font-weight="820" letter-spacing="-1.2">making the</text>
  <text x="24" y="509" fill="#FBF7EF" font-size="38" font-weight="820" letter-spacing="-1.2">expected thing.</text>
  <line x1="24" y1="548" x2="396" y2="548" stroke="#FBF7EF" opacity="0.28"/>
  <text x="24" y="585" fill="#FBF7EF" font-size="16" font-weight="620">Sometimes that is productive.</text>
  <text x="24" y="640" fill="#FBF7EF" opacity="0.72" font-size="12">It still has to work in the morning.</text>
</svg>
