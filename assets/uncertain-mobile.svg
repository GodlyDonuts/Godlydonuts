<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 790" role="img" aria-labelledby="title desc">
  <title id="title">Things I am not certain about</title>
  <desc id="desc">Open questions about intelligence, interfaces, ambition, the AI frontier, and late-night projects.</desc>
  <defs>
    <style>

      .bg { fill: #080808; }
      .paper { fill: #11110f; }
      .fg { fill: #f4f1e8; }
      .muted { fill: #9a978f; }
      .quiet { fill: #5f5d58; }
      .line { stroke: #2c2b28; }
      .accent { fill: #d8ff43; }
      .accent-stroke { stroke: #d8ff43; }
      .day-only { display: none; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #f2eee5; }
        .paper { fill: #ebe5da; }
        .fg { fill: #111111; }
        .muted { fill: #6e6a62; }
        .quiet { fill: #9b958a; }
        .line { stroke: #c9c1b3; }
        .accent { fill: #1b6b4f; }
        .accent-stroke { stroke: #1b6b4f; }
        .night-only { display: none; }
        .day-only { display: inline; }
      }

      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
    </style>
    <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.45" class="quiet" opacity="0.17"/>
      <circle cx="5" cy="4" r="0.35" class="quiet" opacity="0.10"/>
    </pattern>
  </defs>

  <rect class="bg" width="430" height="790"/>
  <rect width="430" height="790" fill="url(#grain)"/>
  <text x="22" y="35" class="mono accent" font-size="9" letter-spacing="1.6">THINGS I DON'T KNOW YET</text>
  <line x1="22" y1="52" x2="408" y2="52" class="line"/>
  <text x="22" y="106" class="serif fg" font-size="29" font-weight="700">I am probably wrong</text>
  <text x="22" y="141" class="serif fg" font-size="29" font-weight="700">about something important.</text>
  <text x="24" y="196" class="mono accent" font-size="9" letter-spacing="1.2">01</text><text x="68" y="196" class="fg" font-size="17" font-weight="620"><tspan x="68" dy="0">Does intelligence need more</tspan>
<tspan x="68" dy="23">scale, or better ways to spend</tspan>
<tspan x="68" dy="23">time?</tspan></text><line x1="68" y1="283" x2="406" y2="283" class="line"/><text x="24" y="307" class="mono accent" font-size="9" letter-spacing="1.2">02</text><text x="68" y="307" class="fg" font-size="17" font-weight="620"><tspan x="68" dy="0">Is the best interface the one</tspan>
<tspan x="68" dy="23">you eventually stop noticing?</tspan></text><line x1="68" y1="371" x2="406" y2="371" class="line"/><text x="24" y="395" class="mono accent" font-size="9" letter-spacing="1.2">03</text><text x="68" y="395" class="fg" font-size="17" font-weight="620"><tspan x="68" dy="0">How much of ambition is talent,</tspan>
<tspan x="68" dy="23">and how much is refusing to</tspan>
<tspan x="68" dy="23">quit?</tspan></text><line x1="68" y1="482" x2="406" y2="482" class="line"/><text x="24" y="506" class="mono accent" font-size="9" letter-spacing="1.2">04</text><text x="68" y="506" class="fg" font-size="17" font-weight="620"><tspan x="68" dy="0">How close is the public frontier</tspan>
<tspan x="68" dy="23">to the private one?</tspan></text><line x1="68" y1="570" x2="406" y2="570" class="line"/><text x="24" y="594" class="mono accent" font-size="9" letter-spacing="1.2">05</text><text x="68" y="594" class="fg" font-size="17" font-weight="620"><tspan x="68" dy="0">Will I ever stop starting</tspan>
<tspan x="68" dy="23">projects at 2 a.m.?</tspan></text><line x1="68" y1="658" x2="406" y2="658" class="line"/>
  <text x="406" y="772" text-anchor="end" class="mono quiet" font-size="8" letter-spacing="1">THE LAST ONE IS NOT REALLY OPEN.</text>

</svg>
