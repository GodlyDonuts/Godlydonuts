<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 680" role="img" aria-labelledby="title desc">
  <title id="title">The pattern, so far</title>
  <desc id="desc">Three recurring habits behind Sai's work.</desc>
  <defs>
    <style>
      .bg { fill: #090B16; }
      .fg { fill: #F5F0E8; }
      .muted { fill: #A9A4B3; }
      .line { stroke: #2B324D; }
      .blue { fill: #4D64FF; }
      .orange { fill: #FF6845; }
      .on-blue { fill: #FBF7EF; }
      .on-orange { fill: #15131B; }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; stroke: none; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #F5F0E7; }
        .fg { fill: #15131B; }
        .muted { fill: #6E6876; }
        .line { stroke: #D2C9BC; }
        .blue { fill: #2645FF; }
        .orange { fill: #ED512F; }
        .on-blue { fill: #FBF7EF; }
        .on-orange { fill: #15131B; }
      }
    </style>
  </defs>

  <rect class="bg" width="846" height="680"/>
  <text x="32" y="82" class="fg" font-size="62" font-weight="900" letter-spacing="-3">the pattern, so far</text>

  <rect class="blue" x="30" y="120" width="786" height="166" rx="2"/>
  <text x="100" y="222" text-anchor="middle" class="on-blue" opacity="0.48" font-size="92" font-weight="900">01</text>
  <line x1="170" y1="144" x2="170" y2="262" stroke="#FBF7EF" opacity="0.22"/>
  <text x="204" y="181" class="on-blue" font-size="31" font-weight="850" letter-spacing="-1">I try to make small models think twice.</text>
  <text x="204" y="224" class="on-blue" opacity="0.80" font-size="17">Shohin gives them somewhere to revise, not just more tokens to spend.</text>

  <text x="100" y="409" text-anchor="middle" class="orange" font-size="92" font-weight="900">02</text>
  <line class="line" x1="170" y1="320" x2="170" y2="441"/>
  <text x="204" y="366" class="fg" font-size="31" font-weight="850" letter-spacing="-1">Sooner or later, I read the source.</text>
  <text x="204" y="409" class="muted" font-size="17">The API is useful until the result stops making sense.</text>
  <text x="204" y="443" class="fg" font-size="12" font-weight="720">PyTorch · TensorFlow · JAX</text>
  <line class="line" x1="30" y1="474" x2="816" y2="474"/>

  <rect class="orange" x="30" y="504" width="786" height="146" rx="2"/>
  <text x="100" y="600" text-anchor="middle" class="on-orange" opacity="0.44" font-size="92" font-weight="900">03</text>
  <line x1="170" y1="526" x2="170" y2="628" stroke="#15131B" opacity="0.24"/>
  <text x="204" y="563" class="on-orange" font-size="31" font-weight="850" letter-spacing="-1">I start before I know how.</text>
  <text x="204" y="604" class="on-orange" font-size="17">The project usually teaches me the rest.</text>
  <text x="204" y="633" class="on-orange" font-size="12" font-weight="720">Porter · Sentinel · Crisis Averted</text>
</svg>
