<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" role="img" aria-labelledby="title desc">
  <title id="title">PyTorch</title>
  <desc id="desc">PyTorch. Global scratch in the static Triton launcher. TorchInductor / GPU runtime Scratch allocation and metadata for restoring kernels from the FX graph cache.</desc>
  <defs><style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.bg { fill: #090B16; } .surface { fill: #12172A; }
.fg { fill: #F5F0E8; } .muted { fill: #A9A4B3; }
.line { stroke: #2B324D; } .blue { fill: #4D64FF; }
.orange { fill: #FF6845; } .on-blue { fill: #FBF7EF; }
.on-orange { fill: #15131B; } .fg-stroke { stroke: #F5F0E8; }
@media (prefers-color-scheme: light) {
 .bg { fill: #F5F0E7; } .surface { fill: #E9E2D7; }
 .fg { fill: #15131B; } .muted { fill: #6E6876; }
 .line { stroke: #D2C9BC; } .blue { fill: #2645FF; }
 .orange { fill: #ED512F; } .fg-stroke { stroke: #15131B; }
}
@media (prefers-reduced-motion: reduce) { .motion { display: none; } }
</style></defs>
  <rect class="bg" width="420" height="340"/>
  <rect class="orange" width="420" height="134"/><text x="24" y="29" class="on-orange" font-size="10.5" font-weight="700" letter-spacing="1.2">ACCEPTED UPSTREAM</text><text x="22" y="102" class="on-orange" font-size="68" font-weight="880" letter-spacing="-2.5">PyTorch</text><path d="M370 24h22v22m0 -22l-22 22" fill="none" stroke="#15131B" stroke-width="2"/><text x="24" y="177" class="fg" font-size="18" font-weight="400" >Global-scratch support in</text>
<text x="24" y="206" class="fg" font-size="18" font-weight="400" >the static Triton launcher.</text>
<text x="24" y="235" class="fg" font-size="18" font-weight="400" >Scratch allocation and metadata</text>
<text x="24" y="264" class="fg" font-size="18" font-weight="400" >for restoring kernels from</text>
<text x="24" y="293" class="fg" font-size="18" font-weight="400" >the FX graph cache.</text>
</svg>
