<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 444" role="img" aria-labelledby="title desc">
<title id="title">The workbench: three animated engineering sketches</title>
<desc id="desc">A gradient flows backward through an autograd graph, a draft passes through revision, and an inference token routes to experts. These are schematic animations, not measured benchmarks.</desc>
<defs><style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.bg{fill:#090B16}.surface{fill:#12172A}.fg{fill:#F5F0E8}.muted{fill:#A9A4B3}.blue{fill:#7C8CFF}.orange{fill:#FF8060}
.blue-fill{fill:#4D64FF}.orange-fill{fill:#FF6845}.node{fill:#1B2036;stroke:#59617B;stroke-width:1.4}.node-blue{fill:#4D64FF;stroke:#9EA8FF;stroke-width:1.5}.node-orange{fill:#FF6845;stroke:#FFAD7A;stroke-width:1.5}
.on-blue{fill:#F7F5FF}.on-orange{fill:#15131B}.rail{stroke:#66708B}.gradient{stroke:#FF6845}.muted-stroke{stroke:#9CA2B1}.orange-stroke{stroke:#FF6845}
.outline{stroke:#313A53}.gridline{stroke:#1A2236}
@media (prefers-color-scheme: light) {
.bg{fill:#F5F0E7}.surface{fill:#E9E2D7}.fg{fill:#15131B}.muted{fill:#5C5964}.blue{fill:#2645FF}.orange{fill:#BD4328}
.node{fill:#F5F0E7;stroke:#B8AFAC}.node-blue{fill:#2645FF;stroke:#3657FF}.node-orange{fill:#ED512F;stroke:#C54429}
.rail{stroke:#A29DA5}.gradient{stroke:#DB5039}.muted-stroke{stroke:#7B7784}.orange-stroke{stroke:#DB5039}.orange-fill{fill:#ED512F}.blue-fill{fill:#2645FF}.outline{stroke:#D2C9BC}.gridline{stroke:#E4DCD0}
}
@media (prefers-reduced-motion: reduce) {.motion{display:none}}
</style></defs><rect width="846" height="444" class="bg"/>
<path d="M1 0V444" class="gridline" opacity=".18"/><path d="M33 0V444" class="gridline" opacity=".18"/><path d="M65 0V444" class="gridline" opacity=".18"/><path d="M97 0V444" class="gridline" opacity=".18"/><path d="M129 0V444" class="gridline" opacity=".18"/><path d="M161 0V444" class="gridline" opacity=".18"/><path d="M193 0V444" class="gridline" opacity=".18"/><path d="M225 0V444" class="gridline" opacity=".18"/><path d="M257 0V444" class="gridline" opacity=".18"/><path d="M289 0V444" class="gridline" opacity=".18"/><path d="M321 0V444" class="gridline" opacity=".18"/><path d="M353 0V444" class="gridline" opacity=".18"/><path d="M385 0V444" class="gridline" opacity=".18"/><path d="M417 0V444" class="gridline" opacity=".18"/><path d="M449 0V444" class="gridline" opacity=".18"/><path d="M481 0V444" class="gridline" opacity=".18"/><path d="M513 0V444" class="gridline" opacity=".18"/><path d="M545 0V444" class="gridline" opacity=".18"/><path d="M577 0V444" class="gridline" opacity=".18"/><path d="M609 0V444" class="gridline" opacity=".18"/><path d="M641 0V444" class="gridline" opacity=".18"/><path d="M673 0V444" class="gridline" opacity=".18"/><path d="M705 0V444" class="gridline" opacity=".18"/><path d="M737 0V444" class="gridline" opacity=".18"/><path d="M769 0V444" class="gridline" opacity=".18"/><path d="M801 0V444" class="gridline" opacity=".18"/>
<text x="22" y="49" class="fg heavy" font-size="35">the workbench<span></span></text><text x="24" y="79" class="muted" font-size="12" letter-spacing="1.6">THREE THINGS I'M TRYING TO UNDERSTAND // NO SYNTHETIC METRICS</text><text x="817" y="47" class="orange" font-size="15" text-anchor="end" font-weight="700">[ 01 - 03 ]</text>
<rect class="surface" x="18" y="100" width="258" height="270" rx="3"/><rect class="outline" x="18.5" y="100.5" width="257" height="269" rx="3" fill="none"/><rect class="blue-fill" x="18" y="100" width="4" height="270"/><text x="38" y="132" class="blue" font-size="12" font-weight="800" letter-spacing="1.7">01 / MECHANICS</text><text x="38" y="162" class="fg" font-size="24" font-weight="800" letter-spacing="-0.5">backpropagation</text><text x="38" y="182" class="muted" font-size="12">follow the gradient, not the API</text><path d="M75 274H219" class="rail" fill="none" stroke-width="2.4"/><path d="M219 294H75" class="gradient" fill="none" stroke-width="2" stroke-dasharray="4 6" opacity=".65"/><circle cx="75" cy="274" r="23" class="node"/><text x="75" y="280" class="fg" font-size="18" font-weight="800" text-anchor="middle">x</text><circle cx="145" cy="274" r="23" class="node-blue"/><text x="145" y="280" class="on-blue" font-size="18" font-weight="800" text-anchor="middle">f</text><circle cx="219" cy="274" r="23" class="node"/><text x="219" y="280" class="fg" font-size="18" font-weight="800" text-anchor="middle">L</text><circle class="motion orange-fill" cx="75" cy="274" r="5"><animate attributeName="cx" values="75;145;219;219" keyTimes="0;.38;.75;1" dur="4.2s" repeatCount="indefinite"/></circle><circle class="motion blue-fill" cx="219" cy="294" r="4.5"><animate attributeName="cx" values="219;145;75;75" keyTimes="0;.38;.75;1" dur="4.2s" begin="1s" repeatCount="indefinite"/></circle><text x="38" y="344" class="muted" font-size="11">FORWARD  /  <tspan class="orange">BACKWARD</tspan></text><rect class="surface" x="294" y="100" width="258" height="270" rx="3"/><rect class="outline" x="294.5" y="100.5" width="257" height="269" rx="3" fill="none"/><rect class="orange-fill" x="294" y="100" width="4" height="270"/><text x="314" y="132" class="orange" font-size="12" font-weight="800" letter-spacing="1.7">02 / RESEARCH</text><text x="314" y="162" class="fg" font-size="24" font-weight="800" letter-spacing="-0.5">revision loops</text><text x="314" y="182" class="muted" font-size="12">can a small model learn to revise?</text><path d="M372 274H392" class="rail" stroke-width="2.3"/><path d="M387 269l8 5 -8 5" class="muted-stroke" fill="none" stroke-width="1.6"/><path d="M449 274H472" class="rail" stroke-width="2.3"/><path d="M467 269l8 5 -8 5" class="muted-stroke" fill="none" stroke-width="1.6"/><rect x="318" y="248" width="54" height="52" rx="5" class="node"/><text x="345" y="281" class="fg" text-anchor="middle" font-size="16" font-weight="800">v0</text><rect x="395" y="248" width="54" height="52" rx="5" class="node"/><text x="422" y="281" class="fg" text-anchor="middle" font-size="16" font-weight="800">test</text><rect x="475" y="248" width="54" height="52" rx="5" class="node-orange"/><text x="502" y="281" class="on-orange" text-anchor="middle" font-size="16" font-weight="800">v1</text><path d="M502 240Q422 181 345 240" class="orange-stroke" fill="none" stroke-width="2" stroke-dasharray="5 5" opacity=".8"/><circle class="orange-fill motion" r="4.5"><animateMotion dur="4.4s" repeatCount="indefinite" path="M502 240Q422 181 345 240"/></circle><text x="314" y="344" class="muted" font-size="11">DRAFT  /  CHECK  /  REVISE</text><rect class="surface" x="570" y="100" width="258" height="270" rx="3"/><rect class="outline" x="570.5" y="100.5" width="257" height="269" rx="3" fill="none"/><rect class="blue-fill" x="570" y="100" width="4" height="270"/><text x="590" y="132" class="blue" font-size="12" font-weight="800" letter-spacing="1.7">03 / SYSTEMS</text><text x="590" y="162" class="fg" font-size="24" font-weight="800" letter-spacing="-0.5">token routing</text><text x="590" y="182" class="muted" font-size="12">where does routed inference stall?</text><rect x="593" y="261" width="42" height="36" rx="5" class="node"/><text x="614" y="284" class="fg" font-size="12" text-anchor="middle" font-weight="700">t</text><path d="M637 279H654" class="rail" fill="none" stroke-width="2.5"/><rect x="653" y="257" width="34" height="44" rx="4" class="node-blue"/><text x="670" y="283" class="on-blue" font-size="9.5" font-weight="800" text-anchor="middle">gate</text><path d="M688 279L745 240" class="rail" fill="none" stroke-width="1.5" opacity=".9"/><rect x="752" y="225" width="49" height="30" rx="3" class="node"/><text x="776" y="244.5" class="fg" text-anchor="middle" font-size="12" font-weight="700">E0</text><circle class="motion blue-fill" r="4"><animateMotion path="M688 279L745 240" dur="3.4s" begin="0s" repeatCount="indefinite"/></circle><path d="M688 279L745 279" class="orange-stroke" fill="none" stroke-width="2.5" opacity=".9"/><rect x="752" y="264" width="49" height="30" rx="3" class="node-orange"/><text x="776" y="283.5" class="on-orange" text-anchor="middle" font-size="12" font-weight="700">E1</text><circle class="motion orange-fill" r="4"><animateMotion path="M688 279L745 279" dur="3.95s" begin="0.6s" repeatCount="indefinite"/></circle><path d="M688 279L745 318" class="rail" fill="none" stroke-width="1.5" opacity=".9"/><rect x="752" y="303" width="49" height="30" rx="3" class="node"/><text x="776" y="322.5" class="fg" text-anchor="middle" font-size="12" font-weight="700">E2</text><circle class="motion blue-fill" r="4"><animateMotion path="M688 279L745 318" dur="4.5s" begin="1.2s" repeatCount="indefinite"/></circle><text x="590" y="344" class="muted" font-size="11">DISPATCH  /  QUEUES  /  MEMORY</text>
<path d="M22 393H824" class="rail" stroke-width="1"/><text x="22" y="419" class="muted" font-size="13">ILLUSTRATIONS, NOT BENCHMARKS. THE REPOSITORIES ARE THE EVIDENCE.</text><circle cx="814" cy="415" r="5" class="orange-fill"><animate class="motion" attributeName="opacity" values=".28;1;.28" dur="2.8s" repeatCount="indefinite"/></circle>
</svg>
