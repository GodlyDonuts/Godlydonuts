<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-label="Terminal session: whoami — sai, cs @ ucf, I build ML systems from first principles. cat now.txt — pretraining a 135M-param reasoning model from scratch on 8xH100. ls proof/ — tensorflow-prs, handwritten-autograd, hackathon-wins, 1.0610-bpb.">
  <title>sai — terminal intro</title>

  <!-- ===== window chrome ===== -->
  <clipPath id="win"><rect x="1.5" y="1.5" width="877" height="297" rx="12"/></clipPath>
  <rect x="1.5" y="1.5" width="877" height="297" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <g clip-path="url(#win)">
    <rect x="1.5" y="1.5" width="877" height="44" fill="#161b22"/>
  </g>
  <line x1="1.5" y1="45.5" x2="878.5" y2="45.5" stroke="#30363d" stroke-width="1"/>
  <circle cx="27" cy="23.5" r="6.5" fill="#ff5f57"/>
  <circle cx="49" cy="23.5" r="6.5" fill="#febc2e"/>
  <circle cx="71" cy="23.5" r="6.5" fill="#2ac840"/>

  <!-- ===== typing clips (one per command) ===== -->
  <clipPath id="t1"><rect x="50" y="66" width="0" height="26"><animate attributeName="width" to="120" begin="0.5s" dur="0.4s" fill="freeze"/></rect></clipPath>
  <clipPath id="t2"><rect x="50" y="126" width="0" height="26"><animate attributeName="width" to="150" begin="2.05s" dur="0.5s" fill="freeze"/></rect></clipPath>
  <clipPath id="t3"><rect x="50" y="186" width="0" height="26"><animate attributeName="width" to="130" begin="3.65s" dur="0.4s" fill="freeze"/></rect></clipPath>

  <g font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15">
    <text x="440" y="28.5" text-anchor="middle" font-size="13" fill="#8b949e">sai@github: ~/proof</text>

    <!-- $ whoami -->
    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="0.35s" dur="0.1s" fill="freeze"/>
      <text x="28" y="84" fill="#3fb950">$</text>
    </g>
    <text x="52" y="84" fill="#e6edf3" clip-path="url(#t1)">whoami</text>
    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="1.1s" dur="0.3s" fill="freeze"/>
      <text x="52" y="114" fill="#c9d1d9">sai · cs @ ucf · I build ML systems from first principles</text>
    </g>

    <!-- $ cat now.txt -->
    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="1.95s" dur="0.1s" fill="freeze"/>
      <text x="28" y="144" fill="#3fb950">$</text>
    </g>
    <text x="52" y="144" fill="#e6edf3" clip-path="url(#t2)">cat now.txt</text>
    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="2.8s" dur="0.3s" fill="freeze"/>
      <text x="52" y="174" fill="#c9d1d9">pretraining a 135M-param reasoning model from scratch · 8×H100</text>
    </g>

    <!-- $ ls proof/ -->
    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="3.55s" dur="0.1s" fill="freeze"/>
      <text x="28" y="204" fill="#3fb950">$</text>
    </g>
    <text x="52" y="204" fill="#e6edf3" clip-path="url(#t3)">ls proof/</text>
    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="4.25s" dur="0.3s" fill="freeze"/>
      <text x="52" y="234" xml:space="preserve"><tspan fill="#79c0ff">tensorflow-prs/</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#79c0ff">handwritten-autograd/</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#79c0ff">hackathon-wins/</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#e6edf3">1.0610-bpb</tspan></text>
    </g>

    <!-- idle prompt + blinking cursor -->
    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="4.95s" dur="0.1s" fill="freeze"/>
      <text x="28" y="264" fill="#3fb950">$</text>
    </g>
    <rect x="52" y="250" width="9.5" height="18" fill="#3fb950" opacity="0">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" calcMode="discrete" dur="1.1s" begin="5.15s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
