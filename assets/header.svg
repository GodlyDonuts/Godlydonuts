<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 312" role="img" aria-label="Terminal session — whoami: sai, cs @ ucf, I build ML systems from first principles. cat now.txt: pretraining a 135M-param reasoning model from scratch on 8×H100. ls proof/: tensorflow-prs, handwritten-autograd, 883-gflops-matmul, hackathon-wins.">
  <title>sai — terminal intro</title>

  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="win"><rect x="10" y="4" width="860" height="296" rx="12"/></clipPath>
    <!-- stepped typing clips: one value per character -->
    <clipPath id="t1"><rect x="54" y="70" width="0" height="24"><animate attributeName="width" values="0;13;22;31;41;50;70" calcMode="discrete" begin="0.5s" dur="0.72s" fill="freeze"/></rect></clipPath>
    <clipPath id="t2"><rect x="54" y="130" width="0" height="24"><animate attributeName="width" values="0;13;22;31;41;50;59;68;77;86;96;120" calcMode="discrete" begin="2.3s" dur="1.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="t3"><rect x="54" y="190" width="0" height="24"><animate attributeName="width" values="0;13;22;31;41;50;59;68;77;100" calcMode="discrete" begin="4.45s" dur="0.9s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- ===== window chrome ===== -->
  <rect x="10" y="4" width="860" height="296" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)"/>
  <g clip-path="url(#win)">
    <rect x="10" y="4" width="860" height="44" fill="#161b22"/>
  </g>
  <line x1="10" y1="48.5" x2="870" y2="48.5" stroke="#30363d" stroke-width="1"/>
  <circle cx="34" cy="26" r="6.5" fill="#ff5f57"/>
  <circle cx="56" cy="26" r="6.5" fill="#febc2e"/>
  <circle cx="78" cy="26" r="6.5" fill="#2ac840"/>

  <g font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15">
    <text x="440" y="31" text-anchor="middle" font-size="13" fill="#8b949e">sai@github: ~/proof</text>

    <!-- $ whoami -->
    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="0.35s" dur="0.1s" fill="freeze"/>
      <text x="32" y="88" fill="#3fb950">$</text>
    </g>
    <text x="56" y="88" fill="#e6edf3" clip-path="url(#t1)">whoami</text>
    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="1.4s" dur="0.3s" fill="freeze"/>
      <text x="56" y="118" fill="#c9d1d9">sai · cs @ ucf · I build ML systems from first principles</text>
    </g>

    <!-- $ cat now.txt -->
    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="2.15s" dur="0.1s" fill="freeze"/>
      <text x="32" y="148" fill="#3fb950">$</text>
    </g>
    <text x="56" y="148" fill="#e6edf3" clip-path="url(#t2)">cat now.txt</text>
    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="3.55s" dur="0.3s" fill="freeze"/>
      <text x="56" y="178" fill="#c9d1d9">pretraining a 135M-param reasoning model from scratch · 8×H100</text>
    </g>

    <!-- $ ls proof/ -->
    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="4.3s" dur="0.1s" fill="freeze"/>
      <text x="32" y="208" fill="#3fb950">$</text>
    </g>
    <text x="56" y="208" fill="#e6edf3" clip-path="url(#t3)">ls proof/</text>
    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="5.5s" dur="0.3s" fill="freeze"/>
      <text x="56" y="238" xml:space="preserve"><tspan fill="#79c0ff">tensorflow-prs/</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#79c0ff">handwritten-autograd/</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#79c0ff">883-gflops-matmul/</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#79c0ff">hackathon-wins/</tspan></text>
    </g>

    <!-- idle prompt + blinking cursor -->
    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="6.05s" dur="0.1s" fill="freeze"/>
      <text x="32" y="268" fill="#3fb950">$</text>
    </g>
    <rect x="56" y="254" width="9.5" height="18" fill="#3fb950" opacity="0">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" calcMode="discrete" dur="1.1s" begin="6.25s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
