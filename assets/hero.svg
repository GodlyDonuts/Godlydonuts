<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Sai's Observatory</title>
  <desc id="desc">An animated eclipse observatory. Sai builds things he does not yet know how to build, following questions through systems and evidence.</desc>

  <defs>
    <radialGradient id="corona" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffb34d" stop-opacity="0"/>
      <stop offset="0.52" stop-color="#ffb34d" stop-opacity="0"/>
      <stop offset="0.61" stop-color="#ffd9a0" stop-opacity="0.92"/>
      <stop offset="0.69" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffd9a0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="panelClip">
      <rect width="1200" height="520" rx="28"/>
    </clipPath>
    <style>
      .bg { fill: #07090d; }
      .grid { stroke: #202631; }
      .line { stroke: #303846; }
      .primary { fill: #f5f3ee; }
      .secondary { fill: #8d96a5; }
      .quiet { fill: #596272; }
      .accent { fill: #f59e0b; }
      .accent-stroke { stroke: #f59e0b; }
      .void { fill: #020305; }
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .static-cycle { display: none; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #f4f0e8; }
        .grid { stroke: #ded7ca; }
        .line { stroke: #c9c0b1; }
        .primary { fill: #111318; }
        .secondary { fill: #5d6570; }
        .quiet { fill: #8f887e; }
        .void { fill: #090a0d; }
      }
      @media (prefers-reduced-motion: reduce) {
        .motion { display: none; }
        .static-cycle { display: inline; }
      }
    </style>
  </defs>

  <g clip-path="url(#panelClip)">
    <rect class="bg" width="1200" height="520"/>

    <!-- measured grid -->
    <g class="grid" stroke-width="1" opacity="0.42">
      <path d="M0 86.5H1200M0 173.5H1200M0 260.5H1200M0 347.5H1200M0 434.5H1200"/>
      <path d="M100.5 0V520M200.5 0V520M300.5 0V520M400.5 0V520M500.5 0V520M600.5 0V520M700.5 0V520M800.5 0V520M900.5 0V520M1000.5 0V520M1100.5 0V520"/>
    </g>

    <!-- moving scan, purely atmospheric -->
    <g class="motion" opacity="0.75">
      <rect x="-260" y="0" width="260" height="520" fill="url(#scan)">
        <animate attributeName="x" values="-260;1200" dur="12s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- observatory / eclipse -->
    <g>
      <circle cx="280" cy="252" r="194" fill="none" class="line" stroke-width="1" stroke-dasharray="2 9" opacity="0.72"/>
      <circle cx="280" cy="252" r="150" fill="none" class="line" stroke-width="1.2" stroke-dasharray="44 7 4 7" opacity="0.88"/>
      <circle cx="280" cy="252" r="116" fill="url(#corona)" filter="url(#glow)">
        <animate class="motion" attributeName="r" values="112;120;112" dur="5.5s" repeatCount="indefinite"/>
        <animate class="motion" attributeName="opacity" values="0.8;1;0.8" dur="5.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="280" cy="252" r="86" class="void"/>
      <circle cx="280" cy="252" r="89" fill="none" stroke="#ffd9a0" stroke-width="2.2" stroke-dasharray="80 480" stroke-linecap="round" filter="url(#softGlow)" transform="rotate(-42 280 252)">
        <animate class="motion" attributeName="stroke-dashoffset" values="0;-560" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle cx="280" cy="252" r="92" fill="none" class="accent-stroke" stroke-width="0.8" stroke-dasharray="5 11" opacity="0.48"/>

      <!-- corona rays -->
      <g class="accent-stroke motion" stroke-linecap="round" opacity="0.46">
        <g>
          <path d="M280 119V92"/><path d="M280 412V385"/>
          <path d="M147 252H120"/><path d="M440 252H413"/>
          <path d="M186 158L167 139"/><path d="M393 365L374 346"/>
          <path d="M374 158L393 139"/><path d="M167 365L186 346"/>
          <animateTransform attributeName="transform" type="rotate" from="0 280 252" to="360 280 252" dur="34s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- orbiting bodies -->
      <g class="motion">
        <g>
          <circle cx="280" cy="102" r="4.3" fill="#ffd9a0" filter="url(#softGlow)"/>
          <animateTransform attributeName="transform" type="rotate" from="0 280 252" to="360 280 252" dur="13s" repeatCount="indefinite"/>
        </g>
        <g>
          <circle cx="474" cy="252" r="3.4" class="accent"/>
          <animateTransform attributeName="transform" type="rotate" from="0 280 252" to="-360 280 252" dur="21s" repeatCount="indefinite"/>
        </g>
        <g>
          <circle cx="280" cy="136" r="2.5" class="primary"/>
          <animateTransform attributeName="transform" type="rotate" from="0 280 252" to="360 280 252" dur="8s" repeatCount="indefinite"/>
        </g>
      </g>
      <g class="static-cycle">
        <circle cx="280" cy="102" r="4.3" fill="#ffd9a0"/>
        <circle cx="474" cy="252" r="3.4" class="accent"/>
      </g>

      <!-- coordinates and orbit labels -->
      <g class="mono" font-size="10" letter-spacing="1.6">
        <text x="48" y="72" class="quiet">OBSERVATORY / 01</text>
        <text x="146" y="96" class="secondary">INTELLIGENCE</text>
        <text x="406" y="137" class="secondary">AGENCY</text>
        <text x="426" y="393" class="secondary">SPACEFLIGHT</text>
        <text x="102" y="426" class="secondary">SYSTEMS</text>
        <text x="65" y="260" class="secondary" transform="rotate(-90 65 260)">EVIDENCE</text>
        <text x="489" y="260" class="secondary" transform="rotate(90 489 260)">TASTE</text>
      </g>
      <path d="M64 470H495" stroke="url(#accentLine)" stroke-width="1"/>
    </g>

    <!-- identity -->
    <g>
      <text x="570" y="72" class="mono accent" font-size="12" letter-spacing="2.8">SIGNAL LOCKED  /  SAI</text>
      <circle cx="1117" cy="67" r="4" class="accent" filter="url(#softGlow)">
        <animate class="motion" attributeName="opacity" values="0.35;1;0.35" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="1132" y="72" class="mono secondary" font-size="10" letter-spacing="1.4">LIVE</text>

      <text x="570" y="168" class="primary" font-size="52" font-weight="650" letter-spacing="-1.8">I build things</text>
      <text x="570" y="230" class="primary" font-size="52" font-weight="650" letter-spacing="-1.8">I do not yet know</text>
      <text x="570" y="292" class="primary" font-size="52" font-weight="650" letter-spacing="-1.8">how to build.</text>

      <line x1="570" y1="337.5" x2="1135" y2="337.5" class="line" stroke-width="1"/>
      <text x="570" y="367" class="mono quiet" font-size="10" letter-spacing="2.2">CURRENT TRANSMISSION</text>

      <g class="mono" font-size="15" letter-spacing="0.45">
        <g class="motion">
          <text x="570" y="402" class="secondary" opacity="1">following a question that became a system</text>
          <animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.249;0.25;0.999;1" calcMode="discrete" dur="20s" repeatCount="indefinite"/>
        </g>
        <g class="motion">
          <text x="570" y="402" class="secondary" opacity="0">going one layer lower than the abstraction</text>
          <animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.499;0.5;1" calcMode="discrete" dur="20s" repeatCount="indefinite"/>
        </g>
        <g class="motion">
          <text x="570" y="402" class="secondary" opacity="0">trying to disprove the beautiful first result</text>
          <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.5;0.749;0.75;1" calcMode="discrete" dur="20s" repeatCount="indefinite"/>
        </g>
        <g class="motion">
          <text x="570" y="402" class="secondary" opacity="0">making software feel like it came from someone</text>
          <animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.75;0.999;1;1" calcMode="discrete" dur="20s" repeatCount="indefinite"/>
        </g>
        <text x="570" y="402" class="secondary static-cycle">following a question that became a system</text>
      </g>

      <text x="570" y="471" class="mono secondary" font-size="11" letter-spacing="2.05">QUESTIONS  /  SYSTEMS  /  EVIDENCE  /  BETTER QUESTIONS</text>
      <text x="1137" y="471" text-anchor="end" class="mono quiet" font-size="10">ORBIT / UNFIXED</text>
    </g>

    <rect x="0.75" y="0.75" width="1198.5" height="518.5" rx="27.25" fill="none" class="line" stroke-width="1.5"/>
  </g>
</svg>
