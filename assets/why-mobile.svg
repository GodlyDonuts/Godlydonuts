<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 820" role="img" aria-labelledby="title desc">
  <title id="title">Why I build</title>
  <desc id="desc">A personal note about following questions across disciplines, distrusting clean results, and caring about taste.</desc>
  <defs>
    <style>

      .bg { fill: #080808; }
      .paper { fill: #11110f; }
      .fg { fill: #f4f1e8; }
      .muted { fill: #9a978f; }
      .quiet { fill: #5f5d58; }
      .line { stroke: #2c2b28; }
      .accent { fill: #d8ff43; }
      .accent-stroke { stroke: #d8ff43; }
      .day-only { display: none; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #f2eee5; }
        .paper { fill: #ebe5da; }
        .fg { fill: #111111; }
        .muted { fill: #6e6a62; }
        .quiet { fill: #9b958a; }
        .line { stroke: #c9c1b3; }
        .accent { fill: #1b6b4f; }
        .accent-stroke { stroke: #1b6b4f; }
        .night-only { display: none; }
        .day-only { display: inline; }
      }

      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
    </style>
    <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.45" class="quiet" opacity="0.17"/>
      <circle cx="5" cy="4" r="0.35" class="quiet" opacity="0.10"/>
    </pattern>
  </defs>

  <rect class="bg" width="430" height="820"/>
  <rect width="430" height="820" fill="url(#grain)"/>
  <text x="22" y="35" class="mono accent" font-size="9" letter-spacing="1.7">WHY I BUILD / NOT A CAREER STATEMENT</text>
  <line x1="22" y1="52" x2="408" y2="52" class="line"/>

  <text x="22" y="118" class="serif fg" font-size="39" font-weight="700">I don't really</text>
  <text x="22" y="162" class="serif fg" font-size="39" font-weight="700">have a lane.</text>
  <text x="24" y="202" class="muted" font-size="16">The problem decides how low I have to go.</text>

  <text x="24" y="267" class="mono quiet" font-size="10.5" text-decoration="line-through">choose a discipline and stay there</text>
  <text x="24" y="309" class="mono accent" font-size="13.5" font-weight="700">follow the question until</text>
  <text x="24" y="333" class="mono accent" font-size="13.5" font-weight="700">the abstraction stops helping</text>

  <line x1="22" y1="377" x2="408" y2="377" class="line"/>
  <text x="22" y="426" class="fg" font-size="21" font-weight="650">I will learn a new field</text>
  <text x="22" y="453" class="fg" font-size="21" font-weight="650">before I make the idea smaller.</text>

  <text x="22" y="522" class="fg" font-size="20" font-weight="650">When a result looks too clean,</text>
  <text x="22" y="549" class="fg" font-size="20" font-weight="650">I assume I missed a control.</text>
  <text x="22" y="583" class="muted" font-size="15">I have deleted weeks of work because one failed.</text>

  <text x="22" y="652" class="fg" font-size="22" font-weight="650">I care about taste.</text>
  <text x="22" y="685" class="muted" font-size="16">Working software can still feel dead.</text>

  <line x1="22" y1="746" x2="408" y2="746" class="line"/>
  <text x="22" y="780" class="mono quiet" font-size="8.5" letter-spacing="1.05">BUILD IT / BREAK IT / UNDERSTAND WHY</text>

</svg>
