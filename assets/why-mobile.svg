<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1000" role="img" aria-labelledby="title desc">
  <title id="title">The pattern, so far</title>
  <desc id="desc">Three recurring habits behind Sai's work.</desc>
  <defs><style>
      .bg { fill: #090B16; }
      .surface { fill: #12172A; }
      .fg { fill: #F5F0E8; }
      .fg-stroke { stroke: #F5F0E8; }
      .muted { fill: #A9A4B3; }
      .muted-stroke { stroke: #A9A4B3; }
      .line { stroke: #2B324D; }
      .blue { fill: #4D64FF; }
      .orange { fill: #FF6845; }
      .on-blue { fill: #FBF7EF; }
      .on-blue-stroke { stroke: #FBF7EF; }
      .on-orange { fill: #15131B; }
      .on-orange-stroke { stroke: #15131B; }
      text { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; stroke: none; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #F5F0E7; }
        .surface { fill: #E9E2D7; }
        .fg { fill: #15131B; }
        .fg-stroke { stroke: #15131B; }
        .muted { fill: #6E6876; }
        .muted-stroke { stroke: #6E6876; }
        .line { stroke: #D2C9BC; }
        .blue { fill: #2645FF; }
        .orange { fill: #ED512F; }
        .on-blue { fill: #FBF7EF; }
        .on-blue-stroke { stroke: #FBF7EF; }
        .on-orange { fill: #15131B; }
        .on-orange-stroke { stroke: #15131B; }
      }
      @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
    </style></defs>
  <rect class="bg" width="420" height="1000"/>
  <text x="22" y="72" class="fg" font-size="48" font-weight="900" letter-spacing="-2">the pattern,</text>
  <text x="22" y="123" class="fg" font-size="48" font-weight="900" letter-spacing="-2">so far</text>

  <rect class="blue" x="18" y="165" width="384" height="224" rx="2"/>
  <text x="38" y="215" class="on-blue" opacity="0.55" font-size="50" font-weight="900">01</text>
  <text x="38" y="271" class="on-blue" font-size="27" font-weight="850" letter-spacing="-0.8">I try to make small models</text>
  <text x="38" y="305" class="on-blue" font-size="27" font-weight="850" letter-spacing="-0.8">think twice.</text>
  <text x="38" y="342" class="on-blue" opacity="0.80" font-size="15.5">Shohin gives them somewhere to revise,</text>
  <text x="38" y="365" class="on-blue" opacity="0.80" font-size="15.5">not just more tokens to spend.</text>

  <line class="line" x1="20" y1="431" x2="400" y2="431"/>
  <text x="22" y="487" class="orange" font-size="50" font-weight="900">02</text>
  <text x="22" y="535" class="fg" font-size="27" font-weight="850" letter-spacing="-0.8">Sooner or later, I read</text>
  <text x="22" y="568" class="fg" font-size="27" font-weight="850" letter-spacing="-0.8">the source.</text>
  <text x="22" y="611" class="muted" font-size="15.5">The API is useful until the result stops</text>
  <text x="22" y="634" class="muted" font-size="15.5">making sense.</text>
  <text x="22" y="676" class="fg" font-size="12" font-weight="720">PyTorch · TensorFlow · JAX</text>

  <rect class="orange" x="18" y="720" width="384" height="248" rx="2"/>
  <text x="38" y="772" class="on-orange" opacity="0.5" font-size="50" font-weight="900">03</text>
  <text x="38" y="827" class="on-orange" font-size="27" font-weight="850" letter-spacing="-0.8">I start before I know</text>
  <text x="38" y="860" class="on-orange" font-size="27" font-weight="850" letter-spacing="-0.8">how.</text>
  <text x="38" y="900" class="on-orange" font-size="16">The project usually teaches me the rest.</text>
  <text x="38" y="941" class="on-orange" font-size="12" font-weight="720">Porter · Sentinel · Crisis Averted</text>
</svg>
