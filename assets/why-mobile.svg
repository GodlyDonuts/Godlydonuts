<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900" role="img" aria-labelledby="title desc">
  <title id="title">The pattern, so far</title>
  <desc id="desc">Three recurring habits behind Sai's work.</desc>
  <defs>
    <style>
      .bg { fill: #090B16; }
      .fg { fill: #F5F0E8; }
      .muted { fill: #A9A4B3; }
      .line { stroke: #2B324D; }
      .blue { fill: #4D64FF; }
      .orange { fill: #FF6845; }
      .on-blue { fill: #FBF7EF; }
      .on-orange { fill: #15131B; }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; stroke: none; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #F5F0E7; }
        .fg { fill: #15131B; }
        .muted { fill: #6E6876; }
        .line { stroke: #D2C9BC; }
        .blue { fill: #2645FF; }
        .orange { fill: #ED512F; }
        .on-blue { fill: #FBF7EF; }
        .on-orange { fill: #15131B; }
      }
    </style>
  </defs>

  <rect class="bg" width="420" height="900"/>
  <text x="22" y="70" class="fg" font-size="48" font-weight="900" letter-spacing="-2">the pattern,</text>
  <text x="22" y="119" class="fg" font-size="48" font-weight="900" letter-spacing="-2">so far</text>

  <rect class="blue" x="18" y="156" width="384" height="230" rx="2"/>
  <text x="60" y="231" text-anchor="middle" class="on-blue" opacity="0.55" font-size="52" font-weight="900">01</text>
  <line x1="100" y1="178" x2="100" y2="364" stroke="#FBF7EF" opacity="0.22"/>
  <text x="124" y="205" class="on-blue" font-size="26" font-weight="850" letter-spacing="-0.8">I try to make</text>
  <text x="124" y="237" class="on-blue" font-size="26" font-weight="850" letter-spacing="-0.8">small models</text>
  <text x="124" y="269" class="on-blue" font-size="26" font-weight="850" letter-spacing="-0.8">think twice.</text>
  <text x="124" y="315" class="on-blue" opacity="0.82" font-size="15.5">Shohin gives them somewhere</text>
  <text x="124" y="337" class="on-blue" opacity="0.82" font-size="15.5">to revise, not just more tokens</text>
  <text x="124" y="359" class="on-blue" opacity="0.82" font-size="15.5">to spend.</text>

  <text x="60" y="493" text-anchor="middle" class="orange" font-size="52" font-weight="900">02</text>
  <line class="line" x1="100" y1="426" x2="100" y2="627"/>
  <text x="124" y="461" class="fg" font-size="26" font-weight="850" letter-spacing="-0.8">Sooner or later,</text>
  <text x="124" y="493" class="fg" font-size="26" font-weight="850" letter-spacing="-0.8">I read the source.</text>
  <text x="124" y="544" class="muted" font-size="15.5">The API is useful until the</text>
  <text x="124" y="566" class="muted" font-size="15.5">result stops making sense.</text>
  <text x="124" y="612" class="fg" font-size="12.2" font-weight="720">PyTorch · TensorFlow · JAX</text>
  <line class="line" x1="20" y1="653" x2="400" y2="653"/>

  <rect class="orange" x="18" y="680" width="384" height="194" rx="2"/>
  <text x="60" y="752" text-anchor="middle" class="on-orange" opacity="0.5" font-size="52" font-weight="900">03</text>
  <line x1="100" y1="701" x2="100" y2="853" stroke="#15131B" opacity="0.24"/>
  <text x="124" y="727" class="on-orange" font-size="26" font-weight="850" letter-spacing="-0.8">I start before</text>
  <text x="124" y="759" class="on-orange" font-size="26" font-weight="850" letter-spacing="-0.8">I know how.</text>
  <text x="124" y="808" class="on-orange" font-size="15.5">The project usually teaches</text>
  <text x="124" y="830" class="on-orange" font-size="15.5">me the rest.</text>
  <text x="124" y="857" class="on-orange" font-size="11.6" font-weight="720">Porter · Sentinel · Crisis Averted</text>
</svg>
