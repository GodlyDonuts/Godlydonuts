<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900" role="img" aria-labelledby="title desc">
  <title id="title">Right now</title>
  <desc id="desc">Sai's latest public change is in sai-initiative: Harden adaptive workspace mechanics. He is thinking about whether revision can be learned instead of prompted.</desc>
  <defs>
    <style>
      .bg { fill: #090B16; }
      .surface { fill: #12172A; }
      .fg { fill: #F5F0E8; }
      .fg-stroke { stroke: #F5F0E8; }
      .muted { fill: #A9A4B3; }
      .muted-stroke { stroke: #A9A4B3; }
      .line { stroke: #2B324D; }
      .blue { fill: #4D64FF; }
      .orange { fill: #FF6845; }
      .on-blue { fill: #FBF7EF; }
      .on-blue-stroke { stroke: #FBF7EF; }
      .on-orange { fill: #15131B; }
      .on-orange-stroke { stroke: #15131B; }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; stroke: none; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #F5F0E7; }
        .surface { fill: #E9E2D7; }
        .fg { fill: #15131B; }
        .fg-stroke { stroke: #15131B; }
        .muted { fill: #6E6876; }
        .muted-stroke { stroke: #6E6876; }
        .line { stroke: #D2C9BC; }
        .blue { fill: #2645FF; }
        .orange { fill: #ED512F; }
        .on-blue { fill: #FBF7EF; }
        .on-blue-stroke { stroke: #FBF7EF; }
        .on-orange { fill: #15131B; }
        .on-orange-stroke { stroke: #15131B; }
      }
      @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
    </style>
  </defs>
  <rect class="bg" width="420" height="900" />
  <rect class="orange" x="0" y="0" width="12" height="900" />
  <text x="26" y="72" class="fg" font-size="54" font-weight="900" letter-spacing="-2.2">right now</text>
  <text id="observed-date" x="394" y="102" text-anchor="end" class="muted" font-size="11" font-weight="650">2026.08.21</text>
  <rect class="blue" x="24" y="130" width="372" height="252" rx="2" />
  <text x="46" y="170" class="on-blue" font-size="15" font-weight="700">last thing I changed</text>
  <text id="repository" x="46" y="220" class="on-blue" font-size="32" font-weight="880" letter-spacing="-1">sai-initiative</text>
  <text id="commit" x="46" y="258" class="on-blue" font-size="18" font-weight="560">
    <tspan x="46" dy="0">Harden adaptive workspace</tspan>
    <tspan x="46" dy="25">mechanics</tspan>
  </text>
  <text x="46" y="351" class="on-blue" opacity="0.65" font-size="11">updates itself from my public repos</text>
  <text x="26" y="437" class="orange" font-size="14" font-weight="750">currently stuck on</text>
  <text id="rabbit-hole" x="26" y="474" class="fg" font-size="22" font-weight="720" letter-spacing="-0.35">
    <tspan x="26" dy="0">whether revision can be</tspan>
    <tspan x="26" dy="29">learned instead of prompted</tspan>
  </text>
  <line class="line" x1="26" y1="584" x2="394" y2="584" />
  <text x="26" y="621" class="orange" font-size="14" font-weight="750">my bet</text>
  <text id="current-bet" x="26" y="658" class="fg" font-size="22" font-weight="720" letter-spacing="-0.35">
    <tspan x="26" dy="0">algorithmic efficiency keeps</tspan>
    <tspan x="26" dy="29">shrinking the hardware gap</tspan>
  </text>
  <line class="line" x1="26" y1="735" x2="394" y2="735" />
  <text x="26" y="772" class="orange" font-size="14" font-weight="750">I changed my mind about</text>
  <text id="changed-mind" x="26" y="809" class="fg" font-size="21" font-weight="720" letter-spacing="-0.3">
    <tspan x="26" dy="0">open models staying a</tspan>
    <tspan x="26" dy="28">generation behind forever</tspan>
  </text>
</svg>
