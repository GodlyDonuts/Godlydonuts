<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 720" role="img" aria-labelledby="title desc">
  <title id="title">Easy ways to derail me</title>
  <desc id="desc">Rockets, the AI race, design, predictions, and project names.</desc>
  <defs><style>
      .bg { fill: #090B16; }
      .surface { fill: #12172A; }
      .fg { fill: #F5F0E8; }
      .fg-stroke { stroke: #F5F0E8; }
      .muted { fill: #A9A4B3; }
      .muted-stroke { stroke: #A9A4B3; }
      .line { stroke: #2B324D; }
      .blue { fill: #4D64FF; }
      .orange { fill: #FF6845; }
      .on-blue { fill: #FBF7EF; }
      .on-blue-stroke { stroke: #FBF7EF; }
      .on-orange { fill: #15131B; }
      .on-orange-stroke { stroke: #15131B; }
      text { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; stroke: none; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #F5F0E7; }
        .surface { fill: #E9E2D7; }
        .fg { fill: #15131B; }
        .fg-stroke { stroke: #15131B; }
        .muted { fill: #6E6876; }
        .muted-stroke { stroke: #6E6876; }
        .line { stroke: #D2C9BC; }
        .blue { fill: #2645FF; }
        .orange { fill: #ED512F; }
        .on-blue { fill: #FBF7EF; }
        .on-blue-stroke { stroke: #FBF7EF; }
        .on-orange { fill: #15131B; }
        .on-orange-stroke { stroke: #15131B; }
      }
      @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
    </style></defs>
  <rect class="bg" width="420" height="720"/>
  <circle class="orange" cx="364" cy="82" r="92"/>
  <circle class="bg" cx="386" cy="70" r="86"/>
  <text x="22" y="69" class="fg" font-size="43" font-weight="900" letter-spacing="-1.8">easy ways</text>
  <text x="22" y="116" class="fg" font-size="43" font-weight="900" letter-spacing="-1.8">to derail me</text>
  <text x="22" y="157" class="muted" font-size="14">This list is not exhaustive.</text>

  <text x="24" y="238" class="orange" font-size="13" font-weight="800">01</text>
  <text x="68" y="238" class="fg" font-size="23" font-weight="770">reusable rockets</text>
  <text x="24" y="306" class="orange" font-size="13" font-weight="800">02</text>
  <text x="68" y="306" class="fg" font-size="23" font-weight="770">who is actually winning</text>
  <text x="68" y="335" class="fg" font-size="23" font-weight="770">the AI race</text>
  <text x="24" y="391" class="orange" font-size="13" font-weight="800">03</text>
  <text x="68" y="391" class="fg" font-size="23" font-weight="770">whether the design has</text>
  <text x="68" y="420" class="fg" font-size="23" font-weight="770">enough aura</text>
  <text x="24" y="476" class="orange" font-size="13" font-weight="800">04</text>
  <text x="68" y="476" class="fg" font-size="23" font-weight="770">a prediction I disagree with</text>
  <text x="24" y="544" class="orange" font-size="13" font-weight="800">05</text>
  <text x="68" y="544" class="fg" font-size="23" font-weight="770">the name of the next project</text>

  <rect class="blue" x="18" y="625" width="384" height="70" rx="2"/>
  <text x="32" y="656" class="on-blue" font-size="16" font-weight="700">I can turn almost any forecast into a debate.</text>
  <text x="32" y="680" class="on-blue" opacity="0.7" font-size="12">This is not always a strength.</text>
</svg>
