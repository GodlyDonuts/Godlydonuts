<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 872" role="img" aria-labelledby="title desc">
<title id="title">The workbench: three animated engineering sketches</title>
<desc id="desc">A gradient flows backward through an autograd graph, a draft passes through revision, and an inference token routes to experts. These are schematic animations, not measured benchmarks.</desc>
<defs><style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.bg{fill:#090B16}.surface{fill:#12172A}.fg{fill:#F5F0E8}.muted{fill:#A9A4B3}.blue{fill:#7C8CFF}.orange{fill:#FF8060}
.blue-fill{fill:#4D64FF}.orange-fill{fill:#FF6845}.node{fill:#1B2036;stroke:#59617B;stroke-width:1.4}.node-blue{fill:#4D64FF;stroke:#9EA8FF;stroke-width:1.5}.node-orange{fill:#FF6845;stroke:#FFAD7A;stroke-width:1.5}
.on-blue{fill:#F7F5FF}.on-orange{fill:#15131B}.rail{stroke:#66708B}.gradient{stroke:#FF6845}.muted-stroke{stroke:#9CA2B1}.orange-stroke{stroke:#FF6845}
.outline{stroke:#313A53}.gridline{stroke:#1A2236}
@media (prefers-color-scheme: light) {
.bg{fill:#F5F0E7}.surface{fill:#E9E2D7}.fg{fill:#15131B}.muted{fill:#5C5964}.blue{fill:#2645FF}.orange{fill:#BD4328}
.node{fill:#F5F0E7;stroke:#B8AFAC}.node-blue{fill:#2645FF;stroke:#3657FF}.node-orange{fill:#ED512F;stroke:#C54429}
.rail{stroke:#A29DA5}.gradient{stroke:#DB5039}.muted-stroke{stroke:#7B7784}.orange-stroke{stroke:#DB5039}.orange-fill{fill:#ED512F}.blue-fill{fill:#2645FF}.outline{stroke:#D2C9BC}.gridline{stroke:#E4DCD0}
}
@media (prefers-reduced-motion: reduce) {.motion{display:none}}
</style></defs><rect width="420" height="872" class="bg"/>
<path d="M1 0V872" class="gridline" opacity=".18"/><path d="M33 0V872" class="gridline" opacity=".18"/><path d="M65 0V872" class="gridline" opacity=".18"/><path d="M97 0V872" class="gridline" opacity=".18"/><path d="M129 0V872" class="gridline" opacity=".18"/><path d="M161 0V872" class="gridline" opacity=".18"/><path d="M193 0V872" class="gridline" opacity=".18"/><path d="M225 0V872" class="gridline" opacity=".18"/><path d="M257 0V872" class="gridline" opacity=".18"/><path d="M289 0V872" class="gridline" opacity=".18"/><path d="M321 0V872" class="gridline" opacity=".18"/><path d="M353 0V872" class="gridline" opacity=".18"/><path d="M385 0V872" class="gridline" opacity=".18"/>
<text x="20" y="39" class="fg heavy" font-size="26">the workbench</text><text x="20" y="65" class="muted" font-size="12">THREE THINGS I'M TRYING TO UNDERSTAND</text>
<rect class="surface" x="18" y="98" width="384" height="222" rx="3"/><rect class="outline" x="18.5" y="98.5" width="383" height="221" rx="3" fill="none"/><rect class="blue-fill" x="18" y="98" width="4" height="222"/><text x="38" y="130" class="blue" font-size="12" font-weight="800" letter-spacing="1.7">01 / MECHANICS</text><text x="38" y="160" class="fg" font-size="24" font-weight="800" letter-spacing="-0.5">backpropagation</text><text x="38" y="180" class="muted" font-size="12">follow the gradient, not the API</text><path d="M107 244H307" class="rail" fill="none" stroke-width="2.4"/><path d="M307 264H107" class="gradient" fill="none" stroke-width="2" stroke-dasharray="4 6" opacity=".65"/><circle cx="107" cy="244" r="25" class="node"/><text x="107" y="250" class="fg" font-size="18" font-weight="800" text-anchor="middle">x</text><circle cx="207" cy="244" r="25" class="node-blue"/><text x="207" y="250" class="on-blue" font-size="18" font-weight="800" text-anchor="middle">f</text><circle cx="307" cy="244" r="25" class="node"/><text x="307" y="250" class="fg" font-size="18" font-weight="800" text-anchor="middle">L</text><circle class="motion orange-fill" cx="107" cy="244" r="5"><animate attributeName="cx" values="107;207;307;307" keyTimes="0;.38;.75;1" dur="4.2s" repeatCount="indefinite"/></circle><circle class="motion blue-fill" cx="307" cy="264" r="4.5"><animate attributeName="cx" values="307;207;107;107" keyTimes="0;.38;.75;1" dur="4.2s" begin="1s" repeatCount="indefinite"/></circle><text x="38" y="294" class="muted" font-size="11">FORWARD  /  <tspan class="orange">BACKWARD</tspan></text><rect class="surface" x="18" y="337" width="384" height="222" rx="3"/><rect class="outline" x="18.5" y="337.5" width="383" height="221" rx="3" fill="none"/><rect class="orange-fill" x="18" y="337" width="4" height="222"/><text x="38" y="369" class="orange" font-size="12" font-weight="800" letter-spacing="1.7">02 / RESEARCH</text><text x="38" y="399" class="fg" font-size="24" font-weight="800" letter-spacing="-0.5">revision loops</text><text x="38" y="419" class="muted" font-size="12">can a small model learn to revise?</text><path d="M126 480H183" class="rail" stroke-width="2.3"/><path d="M178 475l8 5 -8 5" class="muted-stroke" fill="none" stroke-width="1.6"/><path d="M240 480H294" class="rail" stroke-width="2.3"/><path d="M289 475l8 5 -8 5" class="muted-stroke" fill="none" stroke-width="1.6"/><rect x="72" y="454" width="54" height="52" rx="5" class="node"/><text x="99" y="487" class="fg" text-anchor="middle" font-size="16" font-weight="800">v0</text><rect x="186" y="454" width="54" height="52" rx="5" class="node"/><text x="213" y="487" class="fg" text-anchor="middle" font-size="16" font-weight="800">test</text><rect x="297" y="454" width="54" height="52" rx="5" class="node-orange"/><text x="324" y="487" class="on-orange" text-anchor="middle" font-size="16" font-weight="800">v1</text><path d="M324 446Q213 387 99 446" class="orange-stroke" fill="none" stroke-width="2" stroke-dasharray="5 5" opacity=".8"/><circle class="orange-fill motion" r="4.5"><animateMotion dur="4.4s" repeatCount="indefinite" path="M324 446Q213 387 99 446"/></circle><text x="38" y="533" class="muted" font-size="11">DRAFT  /  CHECK  /  REVISE</text><rect class="surface" x="18" y="576" width="384" height="222" rx="3"/><rect class="outline" x="18.5" y="576.5" width="383" height="221" rx="3" fill="none"/><rect class="blue-fill" x="18" y="576" width="4" height="222"/><text x="38" y="608" class="blue" font-size="12" font-weight="800" letter-spacing="1.7">03 / SYSTEMS</text><text x="38" y="638" class="fg" font-size="24" font-weight="800" letter-spacing="-0.5">token routing</text><text x="38" y="658" class="muted" font-size="12">where does routed inference stall?</text><rect x="47" y="705" width="42" height="36" rx="5" class="node"/><text x="68" y="728" class="fg" font-size="12" text-anchor="middle" font-weight="700">t</text><path d="M91 723H146" class="rail" fill="none" stroke-width="2.5"/><rect x="145" y="701" width="34" height="44" rx="4" class="node-blue"/><text x="162" y="727" class="on-blue" font-size="9.5" font-weight="800" text-anchor="middle">gate</text><path d="M180 723L280 681" class="rail" fill="none" stroke-width="1.5" opacity=".9"/><rect x="287" y="666" width="49" height="30" rx="3" class="node"/><text x="311" y="685.5" class="fg" text-anchor="middle" font-size="12" font-weight="700">E0</text><circle class="motion blue-fill" r="4"><animateMotion path="M180 723L280 681" dur="3.4s" begin="0s" repeatCount="indefinite"/></circle><path d="M180 723L280 723" class="orange-stroke" fill="none" stroke-width="2.5" opacity=".9"/><rect x="287" y="708" width="49" height="30" rx="3" class="node-orange"/><text x="311" y="727.5" class="on-orange" text-anchor="middle" font-size="12" font-weight="700">E1</text><circle class="motion orange-fill" r="4"><animateMotion path="M180 723L280 723" dur="3.95s" begin="0.6s" repeatCount="indefinite"/></circle><path d="M180 723L280 765" class="rail" fill="none" stroke-width="1.5" opacity=".9"/><rect x="287" y="750" width="49" height="30" rx="3" class="node"/><text x="311" y="769.5" class="fg" text-anchor="middle" font-size="12" font-weight="700">E2</text><circle class="motion blue-fill" r="4"><animateMotion path="M180 723L280 765" dur="4.5s" begin="1.2s" repeatCount="indefinite"/></circle><text x="38" y="772" class="muted" font-size="11">DISPATCH  /  QUEUES  /  MEMORY</text>
<text x="20" y="835" class="muted" font-size="11">Animated diagrams, not measured benchmarks.</text><rect x="20" y="846" width="380" height="2" class="orange-fill" opacity=".7"/>
</svg>
