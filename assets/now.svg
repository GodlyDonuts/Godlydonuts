<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 520" role="img" aria-labelledby="title desc">
  <title id="title">Right now</title>
  <desc id="desc">Sai's latest public change is in sai-initiative: Add independent data review comparison. He is thinking about whether revision can be learned instead of prompted.</desc>
  <defs>
    <style>
      .bg { fill: #090B16; }
      .surface { fill: #12172A; }
      .fg { fill: #F5F0E8; }
      .fg-stroke { stroke: #F5F0E8; }
      .muted { fill: #A9A4B3; }
      .muted-stroke { stroke: #A9A4B3; }
      .line { stroke: #2B324D; }
      .blue { fill: #4D64FF; }
      .orange { fill: #FF6845; }
      .on-blue { fill: #FBF7EF; }
      .on-blue-stroke { stroke: #FBF7EF; }
      .on-orange { fill: #15131B; }
      .on-orange-stroke { stroke: #15131B; }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; stroke: none; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #F5F0E7; }
        .surface { fill: #E9E2D7; }
        .fg { fill: #15131B; }
        .fg-stroke { stroke: #15131B; }
        .muted { fill: #6E6876; }
        .muted-stroke { stroke: #6E6876; }
        .line { stroke: #D2C9BC; }
        .blue { fill: #2645FF; }
        .orange { fill: #ED512F; }
        .on-blue { fill: #FBF7EF; }
        .on-blue-stroke { stroke: #FBF7EF; }
        .on-orange { fill: #15131B; }
        .on-orange-stroke { stroke: #15131B; }
      }
      @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
    </style>
  </defs>
  <rect class="bg" width="846" height="520" />
  <rect class="orange" x="0" y="0" width="15" height="520" />
  <text x="42" y="82" class="fg" font-size="64" font-weight="900" letter-spacing="-3">right now</text>
  <text id="observed-date" x="810" y="65" text-anchor="end" class="muted" font-size="12" font-weight="650">2026.08.24</text>
  <rect class="blue" x="42" y="120" width="337" height="356" rx="2" />
  <text x="70" y="164" class="on-blue" font-size="15" font-weight="720">last thing I changed</text>
  <text id="repository" x="70" y="222" class="on-blue" font-size="36" font-weight="880" letter-spacing="-1.2">sai-initiative</text>
  <text id="commit" x="70" y="264" class="on-blue" font-size="19" font-weight="560">
    <tspan x="70" dy="0">Add independent data review</tspan>
    <tspan x="70" dy="27">comparison</tspan>
  </text>
  <text x="70" y="443" class="on-blue" opacity="0.65" font-size="11">updates itself from my public repos</text>
  <text x="430" y="139" class="orange" font-size="14" font-weight="760">currently stuck on</text>
  <text id="rabbit-hole" x="430" y="178" class="fg" font-size="22" font-weight="720" letter-spacing="-0.35">
    <tspan x="430" dy="0">whether revision can be learned</tspan>
    <tspan x="430" dy="30">instead of prompted</tspan>
  </text>
  <line class="line" x1="430" y1="247" x2="810" y2="247" />
  <text x="430" y="280" class="orange" font-size="14" font-weight="760">my bet</text>
  <text id="current-bet" x="430" y="319" class="fg" font-size="22" font-weight="720" letter-spacing="-0.35">
    <tspan x="430" dy="0">algorithmic efficiency keeps</tspan>
    <tspan x="430" dy="30">shrinking the hardware gap</tspan>
  </text>
  <line class="line" x1="430" y1="388" x2="810" y2="388" />
  <text x="430" y="421" class="orange" font-size="14" font-weight="760">I changed my mind about</text>
  <text id="changed-mind" x="430" y="460" class="fg" font-size="20" font-weight="720" letter-spacing="-0.3">
    <tspan x="430" dy="0">open models staying a generation</tspan>
    <tspan x="430" dy="27">behind forever</tspan>
  </text>
</svg>
