<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 470" role="img" aria-labelledby="title desc">
  <title id="title">Saicharan Ramineni</title>
  <desc id="desc">Sai. I am not very interested in making the expected thing.</desc>
  <defs><style>
    text { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; }
    @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
  </style></defs>
  <rect width="846" height="470" fill="#090B16"/>
  <rect x="545" y="0" width="301" height="470" fill="#4D64FF"/>
  <text x="32" y="36" fill="#A9A4B3" font-size="13" font-weight="760" letter-spacing="1.7">SAICHARAN RAMINENI</text>
  <text x="32" y="60" fill="#A9A4B3" font-size="12">Computer Science at UCF · Orlando</text>
  <text x="17" y="340" fill="#F5F0E8" font-size="246" font-weight="900" letter-spacing="-20">SAI</text>
  <circle cx="457" cy="120" r="83" fill="#FF6845"/>
  <circle class="motion" cx="479" cy="108" r="78" fill="#090B16">
    <animate attributeName="cx" values="479;461;479" dur="11s" repeatCount="indefinite"/>
  </circle>
  <text x="583" y="104" fill="#FBF7EF" font-size="30" font-weight="820" letter-spacing="-0.8">I am not very</text>
  <text x="583" y="143" fill="#FBF7EF" font-size="30" font-weight="820" letter-spacing="-0.8">interested in</text>
  <text x="583" y="182" fill="#FBF7EF" font-size="30" font-weight="820" letter-spacing="-0.8">making the</text>
  <text x="583" y="221" fill="#FBF7EF" font-size="30" font-weight="820" letter-spacing="-0.8">expected thing.</text>
  <line x1="583" y1="257" x2="813" y2="257" stroke="#FBF7EF" opacity="0.30"/>
  <text x="583" y="296" fill="#FBF7EF" font-size="17" font-weight="650">Sometimes that is productive.</text>
  <text x="583" y="405" fill="#FBF7EF" opacity="0.72" font-size="11.5">Most of this happens after midnight.</text>
  <rect x="32" y="432" width="145" height="4" fill="#FF6845"/>
</svg>
