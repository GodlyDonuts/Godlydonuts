<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 600" role="img" aria-labelledby="title desc">
  <title id="title">Sai — night copy</title>
  <desc id="desc">Sai&#x27;s profile cover. I get obsessed with a question. The stack comes later.</desc>
  <defs>
    <style>

      .bg { fill: #080808; }
      .paper { fill: #11110f; }
      .fg { fill: #f4f1e8; }
      .muted { fill: #9a978f; }
      .quiet { fill: #5f5d58; }
      .line { stroke: #2c2b28; }
      .accent { fill: #d8ff43; }
      .accent-stroke { stroke: #d8ff43; }

      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
    </style>
    <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.45" class="quiet" opacity="0.17"/>
      <circle cx="5" cy="4" r="0.35" class="quiet" opacity="0.10"/>
    </pattern>
  </defs>

  <rect class="bg" width="430" height="600"/>
  <rect width="430" height="600" fill="url(#grain)"/>
  <line x1="24" y1="42" x2="406" y2="42" class="line"/>
  <text x="24" y="29" class="mono accent" font-size="10" letter-spacing="2.1">SAI / NIGHT COPY</text>
  <text x="406" y="29" text-anchor="end" class="mono quiet" font-size="8" letter-spacing="1.2">UCF / FLORIDA</text>
  <text x="20" y="214" class="serif fg" font-size="164" font-weight="700" letter-spacing="-12">SAI</text>
  <text x="333" y="188" class="serif accent" font-size="116" font-style="italic" opacity="0.95">?</text>
  <text x="24" y="290" class="serif fg" font-size="31" font-weight="700">
    <tspan x="24" dy="0">I get obsessed with a</tspan>
<tspan x="24" dy="38">question.</tspan>
  </text>
  <text x="24" y="386" class="fg" font-size="20" font-weight="520">
    <tspan x="24" dy="0">The stack comes later.</tspan>
  </text>
  <line x1="24" y1="470" x2="406" y2="470" class="line"/>
  <text x="24" y="502" class="mono muted" font-size="10" letter-spacing="1.3">MOST OF THIS REPOSITORY HAPPENED AFTER MIDNIGHT.</text>
  <text x="24" y="558" class="mono quiet" font-size="8.5" letter-spacing="1.05">THERE IS ANOTHER VERSION OF THIS PAGE IN DAYLIGHT</text>
  <rect class="motion accent" x="24" y="582" width="52" height="2">
    <animate attributeName="x" values="24;354;24" dur="10s" repeatCount="indefinite"/>
  </rect>

</svg>
