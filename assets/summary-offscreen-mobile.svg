<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 118" role="img" aria-labelledby="title desc">
  <title id="title">OFFSCREEN</title>
  <desc id="desc">Expandable section: OFFSCREEN. Rockets, arguments, names, aura.</desc>
  <defs>
    <style>

      .bg { fill: #080808; }
      .paper { fill: #11110f; }
      .fg { fill: #f4f1e8; }
      .muted { fill: #9a978f; }
      .quiet { fill: #5f5d58; }
