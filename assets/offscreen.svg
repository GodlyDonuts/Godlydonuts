<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 500" role="img" aria-labelledby="title desc">
  <title id="title">Easy ways to derail me</title>
  <desc id="desc">Rockets, the AI race, design, predictions, project names, and lifting.</desc>
  <defs>
    <style>

      .bg { fill: #090B16; }
      .surface { fill: #12172A; }
      .fg { fill: #F5F0E8; }
      .fg-stroke { stroke: #F5F0E8; }
      .muted { fill: #A9A4B3; }
      .muted-stroke { stroke: #A9A4B3; }
      .line { stroke: #2B324D; }
      .blue { fill: #4D64FF; }
      .orange { fill: #FF6845; }
      .on-blue { fill: #FBF7EF; }
      .on-blue-stroke { stroke: #FBF7EF; }
      .on-orange { fill: #15131B; }
      .on-orange-stroke { stroke: #15131B; }
      text { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; stroke: none; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #F5F0E7; }
        .surface { fill: #E9E2D7; }
        .fg { fill: #15131B; }
        .fg-stroke { stroke: #15131B; }
        .muted { fill: #6E6876; }
        .muted-stroke { stroke: #6E6876; }
        .line { stroke: #D2C9BC; }
        .blue { fill: #2645FF; }
        .orange { fill: #ED512F; }
        .on-blue { fill: #FBF7EF; }
        .on-blue-stroke { stroke: #FBF7EF; }
        .on-orange { fill: #15131B; }
        .on-orange-stroke { stroke: #15131B; }
      }
      @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
    </style>

    <radialGradient id="offscreen-d-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0.00" stop-color="#FF6845" stop-opacity="0"/>
      <stop offset="0.57" stop-color="#FF6845" stop-opacity="0"/>
      <stop offset="0.67" stop-color="#FFF0C8" stop-opacity="0.98"/>
      <stop offset="0.71" stop-color="#FFB45C" stop-opacity="0.92"/>
      <stop offset="0.79" stop-color="#FF6845" stop-opacity="0.55"/>
      <stop offset="1.00" stop-color="#FF6845" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="offscreen-d-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#FFF8E8"/>
      <stop offset="0.30" stop-color="#FFD28B"/>
      <stop offset="0.66" stop-color="#FF6845"/>
      <stop offset="1" stop-color="#B82E20"/>
    </linearGradient>
    <filter id="offscreen-d-blur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="offscreen-d-soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>

  <rect class="bg" width="846" height="500"/>

  <g transform="translate(790 18) scale(1.18182)">
    <circle r="126" fill="url(#offscreen-d-halo)" opacity="0.96"/>
    <circle r="103" fill="none" stroke="#FF6845" stroke-width="16" opacity="0.22" filter="url(#offscreen-d-blur)"/>

    <circle class="motion" r="116" fill="none" stroke="#FFB45C" stroke-width="18" opacity="0.14" filter="url(#offscreen-d-blur)">
      <animate attributeName="r" values="108;129;114;125;108" keyTimes="0;0.28;0.54;0.78;1" dur="7.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.08;0.52;0.16;0.38;0.08" keyTimes="0;0.28;0.54;0.78;1" dur="7.4s" repeatCount="indefinite"/>
    </circle>

    <g fill="none" stroke-linecap="round">
      <path d="M-67 -75 C-91 -55 -103 -24 -102 6" stroke="#FFD28B" stroke-width="2.8" opacity="0.74"/>
      <path d="M-82 48 C-66 81 -38 101 -6 106" stroke="#FF6845" stroke-width="3.8" opacity="0.72"/>
      <path d="M28 102 C63 92 91 66 104 34" stroke="#FFB45C" stroke-width="2.6" opacity="0.78"/>
      <path d="M78 -63 C99 -37 106 -8 102 18" stroke="#FFF0C8" stroke-width="2.2" opacity="0.75"/>
      <path d="M-31 -105 C-19 -113 -6 -119 9 -120" stroke="#FF6845" stroke-width="2.1" opacity="0.66"/>
    </g>
    <g stroke="#FF6845" stroke-linecap="round" opacity="0.66">
      <path d="M0 -101V-122" stroke-width="2.4"/>
      <path d="M71 -72L87 -88" stroke-width="2.0"/>
      <path d="M100 4L124 5" stroke-width="2.8"/>
      <path d="M70 74L88 92" stroke-width="2.2"/>
      <path d="M-3 101L-5 126" stroke-width="2.7"/>
      <path d="M-73 72L-92 89" stroke-width="1.8"/>
      <path d="M-101 -5L-126 -6" stroke-width="2.4"/>
      <path d="M-72 -71L-91 -90" stroke-width="2.0"/>
    </g>

    <g class="motion" fill="none" stroke-linecap="round" opacity="0.52">
      <animateTransform attributeName="transform" type="rotate"
        values="-12 0 0;14 0 0;-6 0 0;-12 0 0"
        keyTimes="0;0.34;0.71;1" dur="9.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.34;0.90;0.52;0.34"
        keyTimes="0;0.34;0.71;1" dur="9.6s" repeatCount="indefinite"/>
      <path d="M-78 -79 C-103 -52 -113 -13 -105 22" stroke="#FFF0C8" stroke-width="1.7"/>
      <path d="M-92 39 C-77 78 -43 106 -3 113" stroke="#FF6845" stroke-width="2.7"/>
      <path d="M19 112 C61 103 96 73 110 32" stroke="#FFD28B" stroke-width="2.1"/>
      <path d="M67 -82 C96 -57 111 -21 108 14" stroke="#FFF8E8" stroke-width="1.5"/>
    </g>
    <g class="motion" stroke="#FF6845" stroke-linecap="round" opacity="0.44">
      <animateTransform attributeName="transform" type="rotate"
        values="7 0 0;-9 0 0;4 0 0;7 0 0"
        keyTimes="0;0.36;0.72;1" dur="14.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.28;0.78;0.46;0.28"
        keyTimes="0;0.36;0.72;1" dur="14.2s" repeatCount="indefinite"/>
      <path d="M20 -109L25 -136" stroke-width="2.0"/>
      <path d="M90 -54L114 -69" stroke-width="1.7"/>
      <path d="M108 27L136 34" stroke-width="2.2"/>
      <path d="M54 91L69 117" stroke-width="1.8"/>
      <path d="M-28 107L-35 135" stroke-width="1.9"/>
      <path d="M-91 57L-116 71" stroke-width="1.6"/>
      <path d="M-108 -28L-136 -35" stroke-width="2.0"/>
      <path d="M-54 -91L-69 -117" stroke-width="1.7"/>
    </g>

    <circle r="91" fill="none" stroke="url(#offscreen-d-rim)" stroke-width="6.5"/>
    <circle cx="-3" cy="2" r="86" fill="#090B16"/>
    <path d="M-62 -61 A87 87 0 0 1 74 -44" fill="none" stroke="#FFF6DE" stroke-width="1.4" opacity="0.48"/>

    <circle class="motion" r="94" fill="none" stroke="#FFF8E8" stroke-width="3.0"
      stroke-linecap="round" stroke-dasharray="46 545" opacity="0.55" transform="rotate(-142)">
      <animateTransform attributeName="transform" type="rotate"
        values="-160 0 0;-50 0 0;-110 0 0;-160 0 0"
        keyTimes="0;0.34;0.68;1" dur="7.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.34;1;0.66;0.34"
        keyTimes="0;0.34;0.68;1" dur="7.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="2.2;4.8;3.1;2.2"
        keyTimes="0;0.34;0.68;1" dur="7.4s" repeatCount="indefinite"/>
    </circle>

    <g transform="translate(75 -43)">
      <circle r="17" fill="#FFB45C" opacity="0.42" filter="url(#offscreen-d-blur)"/>
      <circle r="7.2" fill="#FFF8E8" filter="url(#offscreen-d-soft)"/>
      <circle r="3.3" fill="#FFFFFF"/>
      <g stroke="#FFF6DE" stroke-linecap="round" opacity="0.88">
        <path d="M-27 0H27" stroke-width="1.7"/>
        <path d="M0 -27V27" stroke-width="1.7"/>
        <path d="M-18 -18L18 18" stroke-width="1.0"/>
        <path d="M18 -18L-18 18" stroke-width="1.0"/>
      </g>
    </g>

    <g class="motion">
      <animateTransform attributeName="transform" type="rotate"
        values="-72 0 0;30 0 0;-12 0 0;-72 0 0"
        keyTimes="0;0.38;0.73;1" dur="7.4s" repeatCount="indefinite"/>
      <g transform="translate(75 -43)">
        <circle r="15" fill="#FFB45C" opacity="0.22" filter="url(#offscreen-d-blur)">
          <animate attributeName="r" values="11;24;15;11" keyTimes="0;0.38;0.73;1" dur="7.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.10;0.56;0.24;0.10" keyTimes="0;0.38;0.73;1" dur="7.4s" repeatCount="indefinite"/>
        </circle>
        <circle r="4.8" fill="#FFFFFF" opacity="0.68" filter="url(#offscreen-d-soft)">
          <animate attributeName="r" values="3.4;7.4;4.4;3.4" keyTimes="0;0.38;0.73;1" dur="7.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.38;1;0.58;0.38" keyTimes="0;0.38;0.73;1" dur="7.4s" repeatCount="indefinite"/>
        </circle>
        <g stroke="#FFF8E8" stroke-linecap="round" opacity="0.78">
          <path d="M-17 0H17" stroke-width="1.35"/>
          <path d="M0 -17V17" stroke-width="1.35"/>
          <path d="M-11 -11L11 11" stroke-width="0.8"/>
          <path d="M11 -11L-11 11" stroke-width="0.8"/>
        </g>
      </g>
    </g>

    <circle class="motion" r="110" fill="none" stroke="#FFD28B" stroke-width="1.5" opacity="0.28">
      <animate attributeName="r" values="103;123;108;103" keyTimes="0;0.42;0.74;1" dur="6.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.12;0.58;0.24;0.12" keyTimes="0;0.42;0.74;1" dur="6.8s" repeatCount="indefinite"/>
    </circle>
    <circle class="motion" r="119" fill="none" stroke="#FF6845" stroke-width="1.2" opacity="0.16">
      <animate attributeName="r" values="111;137;119;111" keyTimes="0;0.46;0.76;1" dur="9.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.06;0.38;0.15;0.06" keyTimes="0;0.46;0.76;1" dur="9.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="34" y="78" class="fg" font-size="56" font-weight="900" letter-spacing="-2.5">easy ways to derail me</text>
  <text x="36" y="112" class="muted" font-size="14">Any one of these will do.</text>

  <text x="38" y="181" class="orange" font-size="13" font-weight="800">01</text>
  <text x="88" y="181" class="fg" font-size="25" font-weight="790">reusable rockets</text>
  <text x="38" y="242" class="orange" font-size="13" font-weight="800">02</text>
  <text x="88" y="242" class="fg" font-size="25" font-weight="790">who is actually winning</text>
  <text x="88" y="271" class="fg" font-size="25" font-weight="790">the AI race</text>
  <text x="38" y="332" class="orange" font-size="13" font-weight="800">03</text>
  <text x="88" y="332" class="fg" font-size="25" font-weight="790">whether the design has</text>
  <text x="88" y="361" class="fg" font-size="25" font-weight="790">enough aura</text>

  <text x="448" y="181" class="orange" font-size="13" font-weight="800">04</text>
  <text x="498" y="181" class="fg" font-size="24" font-weight="790">a prediction I think is wrong</text>
  <text x="448" y="242" class="orange" font-size="13" font-weight="800">05</text>
  <text x="498" y="242" class="fg" font-size="24" font-weight="790">naming the next project</text>
  <text x="448" y="332" class="orange" font-size="13" font-weight="800">06</text>
  <text x="498" y="332" class="fg" font-size="24" font-weight="790">lifting, eventually</text>

  <rect class="blue" x="34" y="405" width="778" height="62" rx="2"/>
  <text x="58" y="433" class="on-blue" font-size="18" font-weight="720">I can turn almost any forecast into a debate.</text>
  <text x="58" y="455" class="on-blue" opacity="0.70" font-size="12">Usually before anyone asks.</text>
</svg>
