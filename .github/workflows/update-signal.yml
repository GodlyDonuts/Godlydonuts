name: Refresh living signal

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/signal.json"
      - "scripts/render_signal.py"
      - ".github/workflows/update-signal.yml"

permissions:
  contents: write

concurrency:
  group: living-signal
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Render public trace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/render_signal.py --user GodlyDonuts

      - name: Validate generated SVG
        run: |
          python3 - <<'PY'
          from xml.etree import ElementTree
          ElementTree.parse("assets/signal.svg")
          PY
          git diff --check

      - name: Publish only when the signal changed
        run: |
          if git diff --quiet -- assets/signal.svg; then
            echo "Public trace is unchanged."
            exit 0
          fi

          git config user.name "sai-signal[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/signal.svg
          git commit -m "chore: refresh living signal"
          git push origin HEAD:main
