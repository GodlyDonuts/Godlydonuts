name: Validate profile singularity

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "assets/singularity*"
      - "scripts/build_singularity.py"
      - "scripts/build_profile_art.py"
      - "scripts/validate_singularity.py"
      - "scripts/requirements-art.txt"
      - "assets/fonts/**"
      - ".github/workflows/validate-singularity.yml"
  pull_request:
    paths:
      - "README.md"
      - "assets/singularity*"
      - "scripts/build_singularity.py"
      - "scripts/build_profile_art.py"
      - "scripts/validate_singularity.py"
      - "scripts/requirements-art.txt"
      - "assets/fonts/**"
      - ".github/workflows/validate-singularity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  singularity:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install image validation dependencies
        run: python3 -m pip install -r scripts/requirements-art.txt

      - name: Check source syntax and lightweight README generation
        run: |
          python3 -m py_compile scripts/build_singularity.py scripts/build_profile_art.py scripts/validate_singularity.py
          python3 scripts/build_profile_art.py
          git diff --exit-code -- README.md assets

      - name: Decode and validate delivered media
        run: python3 scripts/validate_singularity.py --json

      - name: Check whitespace
        run: |
          git diff --check
