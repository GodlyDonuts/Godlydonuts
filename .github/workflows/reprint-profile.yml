name: Publish editorial profile v3

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "bundle.part.*"
      - ".github/workflows/reprint-profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-v3-publish
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Check whether every archive part is present
        id: bundle
        shell: bash
        run: |
          ready=true
          for part in 01 02 03 04 05 06; do
            if [[ ! -f "bundle.part.${part}" ]]; then
              ready=false
            fi
          done
          echo "ready=${ready}" >> "$GITHUB_OUTPUT"
          if [[ "$ready" == "false" ]]; then
            echo "Waiting for the remaining archive parts."
          fi

      - name: Reconstruct and verify the exact profile archive
        if: steps.bundle.outputs.ready == 'true'
        run: |
          cat bundle.part.* > /tmp/profile-v3.tar.gz.b64
          base64 --decode /tmp/profile-v3.tar.gz.b64 > /tmp/profile-v3.tar.gz
          echo "af519bf01fd8f920116607c35cce7b89f0460dcf44059b491add10e70f2e275f  /tmp/profile-v3.tar.gz" | sha256sum --check --strict

      - name: Replace the repository tree
        if: steps.bundle.outputs.ready == 'true'
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/profile-v3.tar.gz -C .

      - name: Validate the finished profile
        if: steps.bundle.outputs.ready == 'true'
        run: |
          python3 -m py_compile scripts/render_profile.py
          python3 scripts/render_profile.py --offline --user GodlyDonuts
          python3 - <<'PY'
          import json
          from pathlib import Path
          from xml.etree import ElementTree

          json.load(open("data/profile.json", encoding="utf-8"))
          assets = sorted(Path("assets").glob("*.svg"))
          if len(assets) != 28:
              raise SystemExit(f"expected 28 SVG assets, found {len(assets)}")
          for asset in assets:
              ElementTree.parse(asset)
          print("validated 28 SVG assets and deterministic renderer")
          PY
          git diff --check

      - name: Publish the clean tree to main
        if: steps.bundle.outputs.ready == 'true'
        run: |
          git config user.name "sai-profile[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github .gitignore README.md assets data scripts tests bundle.part.01 bundle.part.02 bundle.part.03 bundle.part.04 bundle.part.05 bundle.part.06

          if git diff --cached --quiet; then
            echo "The editorial profile is already published."
            exit 0
          fi

          git commit -m "Publish the responsive editorial profile"
          git push origin HEAD:main
