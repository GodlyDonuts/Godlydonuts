name: Send me a strange idea
description: A question, prediction, or collaboration that will not leave you alone.
title: "[strange idea] "
body:
  - type: markdown
    attributes:
      value: |
        Skip the pitch. Tell me the thing.

  - type: textarea
    id: idea
    attributes:
      label: What is it?
      description: One clear paragraph is better than a deck.
      placeholder: The idea, question, prediction, or problem.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why will it not leave you alone?
      placeholder: What makes this worth thinking about?
    validations:
      required: true

  - type: textarea
    id: real
    attributes:
      label: What would make it real?
      description: A test, prototype, experiment, conversation, or next move.
      placeholder: The smallest serious next step.
    validations:
      required: true
